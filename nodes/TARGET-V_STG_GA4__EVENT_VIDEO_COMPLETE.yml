        dependencies:
          - locationName: TARGET
            nodeName: V_STG_GA4__EVENTS
        join:
          joinCondition: |-
            FROM {{ ref('TARGET', 'V_STG_GA4__EVENTS') }} "V_STG_GA4__EVENTS"

            LEFT JOIN  (
                SELECT value
                FROM {{ ref('TARGET', 'V_STG_GA4__EVENTS') }},
                lateral FLATTEN(input => V_STG_GA4__EVENTS.event_params, OUTER => TRUE) 
                WHERE value:key = 'video_current_time'
            )ep_video_current_time  ON TRUE

            -- video_duration

            LEFT JOIN  (
                SELECT value
                FROM {{ ref('TARGET', 'V_STG_GA4__EVENTS') }},
                lateral FLATTEN(input => V_STG_GA4__EVENTS.event_params, OUTER => TRUE) 
                WHERE value:key = 'video_duration'
            )ep_video_duration  ON TRUE

            -- video_percent

            LEFT JOIN  (
                SELECT value
                FROM {{ ref('TARGET', 'V_STG_GA4__EVENTS') }},
                lateral FLATTEN(input => V_STG_GA4__EVENTS.event_params, OUTER => TRUE) 
                WHERE value:key = 'video_percent'
            )ep_video_percent  ON TRUE

            -- video_url

            LEFT JOIN  (
                SELECT value
                FROM {{ ref('TARGET', 'V_STG_GA4__EVENTS') }},
                lateral FLATTEN(input => V_STG_GA4__EVENTS.event_params, OUTER => TRUE) 
                WHERE value:key = 'video_url'
            ) ep_video_url ON TRUE

            -- video_provider

            LEFT JOIN  (
                SELECT value
                FROM {{ ref('TARGET', 'V_STG_GA4__EVENTS') }},
                lateral FLATTEN(input => V_STG_GA4__EVENTS.event_params, OUTER => TRUE) 
                WHERE value:key = 'video_provider'
            )ep_video_provider  ON TRUE

            -- video_title (you had a typo as 'vide_title')

            LEFT JOIN  (
                SELECT value
                FROM {{ ref('TARGET', 'V_STG_GA4__EVENTS') }},
                lateral FLATTEN(input => V_STG_GA4__EVENTS.event_params, OUTER => TRUE) 
                WHERE value:key = 'video_title'
            )ep_video_title  ON TRUE

            -- visible

            LEFT JOIN  (
                SELECT value
                FROM {{ ref('TARGET', 'V_STG_GA4__EVENTS') }},
                lateral FLATTEN(input => V_STG_GA4__EVENTS.event_params, OUTER => TRUE) 
                WHERE value:key = 'visible'
            )ep_visible  ON TRUE

            WHERE V_STG_GA4__EVENTS.event_name = 'video_complete';
