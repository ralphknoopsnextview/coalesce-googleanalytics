        name: DEFAULT_CHANNEL_GROUPING
        nullable: true
        sourceColumnReferences:
          - columnReferences:
              - columnCounter: "0"
                stepCounter: "0"
            transform: |-
              CASE
                -- Direct
                WHEN (event_source IS NULL AND event_medium IS NULL)
                  OR (event_source = '(direct)' AND event_medium IN ('(none)', '(not set)')) THEN 'Direct'

                -- Cross-network
                WHEN REGEXP_LIKE(event_campaign, 'cross-network') THEN 'Cross-network'

                -- Paid Shopping
                WHEN (
                    source_category = 'SOURCE_CATEGORY_SHOPPING'
                    OR REGEXP_LIKE(event_campaign, '^(.*(([^a-df-z]|^)shop|shopping).*)$')
                  )
                  AND REGEXP_LIKE(event_medium, '^(.*cp.*|ppc|retargeting|paid.*)$') THEN 'Paid Shopping'

                -- Paid Search
                WHEN source_category = 'SOURCE_CATEGORY_SEARCH'
                  AND REGEXP_LIKE(event_medium, '^(.*cp.*|ppc|retargeting|paid.*)$') THEN 'Paid Search'

                -- Paid Social
                WHEN source_category = 'SOURCE_CATEGORY_SOCIAL'
                  AND REGEXP_LIKE(event_medium, '^(.*cp.*|ppc|retargeting|paid.*)$') THEN 'Paid Social'

                -- Paid Video
                WHEN source_category = 'SOURCE_CATEGORY_VIDEO'
                  AND REGEXP_LIKE(event_medium, '^(.*cp.*|ppc|retargeting|paid.*)$') THEN 'Paid Video'

                -- Display
                WHEN event_medium IN ('display', 'banner', 'expandable', 'interstitial', 'cpm') THEN 'Display'

                -- Paid Other
                WHEN REGEXP_LIKE(event_medium, '^(.*cp.*|ppc|retargeting|paid.*)$') THEN 'Paid Other'

                -- Organic Shopping
                WHEN source_category = 'SOURCE_CATEGORY_SHOPPING'
                  OR REGEXP_LIKE(event_campaign, '^(.*(([^a-df-z]|^)shop|shopping).*)$') THEN 'Organic Shopping'

                -- Organic Social
                WHEN source_category = 'SOURCE_CATEGORY_SOCIAL'
                  OR event_medium IN ('social', 'social-network', 'social-media', 'sm', 'social network', 'social media') THEN 'Organic Social'

                -- Organic Video
                WHEN source_category = 'SOURCE_CATEGORY_VIDEO'
                  OR REGEXP_LIKE(event_medium, '^(.*video.*)$') THEN 'Organic Video'

                -- Organic Search
                WHEN source_category = 'SOURCE_CATEGORY_SEARCH'
                  OR event_medium = 'organic' THEN 'Organic Search'

                -- Referral
                WHEN event_medium IN ('referral', 'app', 'link') THEN 'Referral'

                -- Email
                WHEN REGEXP_LIKE(event_source, 'email|e-mail|e_mail|e mail')
                  OR REGEXP_LIKE(event_medium, 'email|e-mail|e_mail|e mail') THEN 'Email'

                -- Affiliates
                WHEN event_medium = 'affiliate' THEN 'Affiliates'

                -- Audio
                WHEN event_medium = 'audio' THEN 'Audio'

                -- SMS
                WHEN event_source = 'sms'
                  OR event_medium = 'sms' THEN 'SMS'

                -- Mobile Push Notifications
                WHEN REGEXP_LIKE(event_medium, 'push$')
                  OR REGEXP_LIKE(event_medium, 'mobile|notification')
                  OR event_source = 'firebase' THEN 'Mobile Push Notifications'

                -- Unassigned
                ELSE 'Unassigned'
              END
